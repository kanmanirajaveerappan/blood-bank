version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: lifelink-postgres
    environment:
      POSTGRES_DB: lifelink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: lifelink-backend
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lifelink
      - DEBUG=False
      - JWT_SECRET=redradius-production-secret-key
    ports:
      - '8000:8000'
    command: gunicorn --bind 0.0.0.0:8000 --workers 1 --threads 8 --timeout 120 app.main:app

  frontend:
    build:
      context: ./frontend
    container_name: lifelink-frontend
    ports:
      - '5173:5173'
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
